<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>냉장고 비우기 — 식비 절약 레시피</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#0e1b30; --card:#172b46; --ink:#e9eef7; --ink-soft:#b3c2d8; --muted:#7d8caa;
    --line:#2c3e5b; --line-soft:#213450;
    --green:#3fae7c; --green-soft:#163a2c; --green-ink:#74d6a3;
    --amber:#e2a44d; --amber-soft:#3a2d14; --amber-ink:#f1c67c;
    --red:#e26a5b; --red-soft:#3a1e1a; --red-ink:#f29a8d;
    --accent:#2f9f6b; --chip:#1f3454;
    --serif:'Gowun Batang',serif; --sans:'Noto Sans KR',sans-serif;
    --shadow:0 1px 3px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.55;
       -webkit-font-smoothing:antialiased;padding-bottom:76px}
  h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:-.3px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:15px;color:var(--ink)}
  .app{max-width:540px;margin:0 auto;min-height:100vh;background:var(--bg)}

  /* ===== Header ===== */
  header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 18px 14px;position:sticky;top:0;z-index:30}
  header .hbar{display:flex;align-items:center;gap:14px;justify-content:space-between}
  .fridge-ico{flex-shrink:0;width:50px;height:50px}
  .fridge-ico svg{width:50px;height:50px;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
  header .eyebrow{font-size:11px;letter-spacing:3px;color:var(--green);font-weight:700}
  header h1{font-size:22px;margin-top:4px}
  header .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

  /* ===== Tabs (bottom nav) ===== */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
          display:flex;max-width:540px;margin:0 auto;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
                 font-size:10.5px;color:var(--muted);font-weight:500;position:relative}
  .tabbar button .ic{font-size:19px;line-height:1}
  .tabbar button.on{color:var(--accent);font-weight:700}
  .tabbar button .badge{position:absolute;top:4px;right:50%;transform:translateX(16px);background:var(--red);
                 color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;
                 display:flex;align-items:center;justify-content:center;padding:0 3px}

  main{padding:16px 14px 28px}
  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin:18px 2px 9px;
                 display:flex;align-items:center;gap:6px}
  .section-title:first-child{margin-top:4px}
  .hint{font-size:12px;color:var(--muted);margin:2px 2px 10px}

  /* ===== Cards ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  /* ===== Chips (ingredient quick-pick) ===== */
  .catrow{margin-bottom:12px}
  .catname{font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 2px 6px;display:flex;align-items:center;gap:5px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:18px;padding:6px 12px;font-size:13px;
        color:var(--ink-soft);transition:.12s;font-weight:500}
  .chip:active{transform:scale(.94)}
  .chip.on{background:var(--green-soft);border-color:var(--green);color:var(--green-ink);font-weight:700}
  .chip.on::before{content:"✓ ";font-size:11px}

  /* custom add row */
  .addrow{display:flex;gap:7px;margin-top:4px}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
  .addrow button{background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;font-size:14px}

  /* my fridge list */
  .ing{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line-soft)}
  .ing:last-child{border-bottom:none}
  .ing .nm{font-weight:700;font-size:14.5px;flex-shrink:0}
  .ing .meta{display:flex;gap:5px;flex-wrap:wrap;flex:1}
  .ing .qty{font-size:12px;color:var(--ink-soft);background:var(--chip);padding:2px 8px;border-radius:8px}
  .ing .exp{font-size:11.5px;padding:2px 8px;border-radius:8px;font-weight:600}
  .exp.ok{background:var(--green-soft);color:var(--green-ink)}
  .exp.soon{background:var(--amber-soft);color:var(--amber-ink)}
  .exp.urgent{background:var(--red-soft);color:var(--red-ink)}
  .exp.gone{background:var(--line);color:var(--muted);text-decoration:line-through}
  .ing .del{margin-left:auto;color:var(--muted);font-size:18px;padding:2px 6px;flex-shrink:0}
  .ing .editbtn{color:var(--muted);font-size:14px;padding:2px 4px}

  /* edit detail panel */
  .editpanel{background:var(--line-soft);padding:12px;border-radius:10px;margin:8px 0}
  .field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .field label{font-size:12px;color:var(--ink-soft);width:64px;flex-shrink:0;font-weight:600}
  .field input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}

  /* ===== Filters ===== */
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .fbtn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12.5px;
        color:var(--ink-soft);font-weight:600}
  .fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ===== Recipe card ===== */
  .rcard{padding:14px;margin-bottom:11px;position:relative;overflow:hidden}
  .rcard .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .rcard .emoji{font-size:30px;line-height:1}
  .rcard h3{font-size:17px;margin-bottom:3px}
  .rcard .tagline{font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;margin-top:3px}
  .rcard .tagline b{color:var(--ink-soft);font-weight:600}
  .star{font-size:20px;color:var(--line);flex-shrink:0;padding:2px}
  .star.on{color:var(--amber)}

  .matchbar{margin-top:11px}
  .matchbar .lbl{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
  .matchbar .lbl .pct{font-weight:700}
  .track{height:7px;background:var(--line-soft);border-radius:4px;overflow:hidden}
  .track .fill{height:100%;border-radius:4px;transition:width .4s}

  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
  .b{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
  .b.full{background:var(--green-soft);color:var(--green-ink)}
  .b.near{background:var(--amber-soft);color:var(--amber-ink)}
  .b.urgent{background:var(--red-soft);color:var(--red-ink)}
  .b.cost{background:var(--chip);color:var(--ink-soft)}

  .haverow{margin-top:11px;font-size:12.5px;line-height:1.7}
  .haverow .lab{color:var(--muted);font-weight:600;margin-right:4px}
  .ig{display:inline-block;padding:1px 8px;border-radius:7px;margin:2px 3px 0 0;font-size:12px}
  .ig.has{background:var(--green-soft);color:var(--green-ink)}
  .ig.miss{background:var(--red-soft);color:var(--red-ink)}
  .ig.expsoon{outline:2px solid var(--amber);outline-offset:-2px}

  .rcard .actions{display:flex;gap:8px;margin-top:12px}
  .rcard .actions button{flex:1;border-radius:10px;padding:9px;font-size:13px;font-weight:700}
  .btn-prime{background:var(--accent);color:#fff}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-soft)}

  /* ===== Modal (recipe detail) ===== */
  .overlay{position:fixed;inset:0;background:rgba(40,34,26,.5);z-index:60;display:flex;align-items:flex-end;
           justify-content:center;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;border-radius:20px 20px 0 0;
         overflow-y:auto;animation:slideup .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(40px);opacity:.6}}
  .sheet .shead{position:sticky;top:0;background:var(--bg);padding:16px 18px 12px;border-bottom:1px solid var(--line);
                display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
  .sheet .shead h2{font-size:21px}
  .sheet .closeb{font-size:26px;color:var(--muted);line-height:1;padding:0 2px}
  .sheet .sbody{padding:16px 18px 30px}
  .detail-tags{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:5px}
  .detail-tags span{background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:9px}
  .dsec-title{font-size:14px;font-weight:700;color:var(--accent);margin:20px 0 9px;
              border-bottom:2px solid var(--line);padding-bottom:5px;font-family:var(--serif)}
  .ing-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .ing-line:last-child{border-bottom:none}
  .ing-line .price{color:var(--muted);font-size:12.5px}
  .ing-line.miss .nm{color:var(--red-ink)}
  .ing-line.miss .nm::after{content:" · 없음";font-size:11px;color:var(--red)}
  .step{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.6}
  .step:last-child{border-bottom:none}
  .step .n{width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;
           font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .costbox{background:var(--green-soft);border-radius:12px;padding:14px;text-align:center;margin-top:6px}
  .costbox .big{font-size:28px;font-weight:700;color:var(--green-ink);font-family:var(--serif)}
  .costbox .lab{font-size:12px;color:var(--green-ink);font-weight:600}
  .costbox .vs{font-size:12px;color:var(--ink-soft);margin-top:6px}

  /* ===== Shopping list ===== */
  .shop-item{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid var(--line-soft)}
  .shop-item:last-child{border-bottom:none}
  .checkbox{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .checkbox.on{background:var(--green);border-color:var(--green)}
  .shop-item .nm{font-weight:600;font-size:14.5px}
  .shop-item.done .nm{text-decoration:line-through;color:var(--muted)}
  .shop-item .from{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}

  /* ===== Tracker ===== */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .stat{padding:15px 14px;text-align:center}
  .stat .v{font-size:24px;font-weight:700;font-family:var(--serif);color:var(--ink)}
  .stat .v.save{color:var(--green-ink)}
  .stat .k{font-size:11.5px;color:var(--muted);margin-top:3px}
  .stat .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
  .setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px;font-size:13.5px}
  .setting-row input{width:110px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;
              font-size:13px;font-weight:600;color:var(--ink-soft)}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ===== Log / records ===== */
  .logcard{padding:0;margin-bottom:11px;overflow:hidden}
  .logcard img{width:100%;height:170px;object-fit:cover;display:block;background:var(--line-soft)}
  .logcard .lc-body{padding:12px 14px}
  .logcard .lc-top{display:flex;justify-content:space-between;align-items:baseline}
  .logcard h3{font-size:16px}
  .logcard .date{font-size:11.5px;color:var(--muted)}
  .logcard .memo{font-size:13.5px;color:var(--ink-soft);margin-top:6px;white-space:pre-wrap}
  .logcard .lc-cost{font-size:12px;color:var(--green-ink);font-weight:700;margin-top:7px}
  .logcard .lc-del{font-size:12px;color:var(--muted);margin-top:8px;text-decoration:underline}

  /* empty states */
  .empty{text-align:center;padding:46px 24px;color:var(--muted)}
  .empty .e-ic{font-size:40px;margin-bottom:10px}
  .empty .e-t{font-size:15px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;font-family:var(--serif)}
  .empty .e-d{font-size:13px}

  /* log form */
  .logform .field-col{margin-bottom:12px}
  .logform label.fl{font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:5px}
  .logform input[type=text],.logform textarea{width:100%;border:1px solid var(--line);border-radius:10px;
            padding:10px 12px;background:var(--card);font-size:14px}
  .logform textarea{min-height:70px;resize:vertical;font-family:inherit}
  .photo-drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);
              font-size:13px;background:var(--card)}
  .photo-drop img{max-width:100%;border-radius:10px;margin-top:8px}
  .savebtn{width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:700;margin-top:6px}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
         padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:80;animation:fade .2s;
         box-shadow:0 4px 16px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<script type="text/jsx-source" id="app-src">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   재료 카테고리 (빠른 선택용)
============================================================ */
const CATEGORIES = [
  { name:"채소", icon:"🥬", items:["양파","대파","마늘","당근","감자","애호박","양배추","배추","청양고추","부추","콩나물","시금치","버섯","무","오이","토마토","가지","고구마","쪽파","깻잎","숙주","피망"] },
  { name:"육류", icon:"🥩", items:["돼지고기","소고기","닭고기","베이컨","햄","소시지","스팸"] },
  { name:"유제품·계란", icon:"🥚", items:["계란","우유","치즈","버터"] },
  { name:"곡류·면", icon:"🍚", items:["밥","쌀","국수","소면","라면","라면사리","떡","떡국떡","당면","우동","식빵","밀가루"] },
  { name:"수산·기타", icon:"🐟", items:["두부","순두부","김치","김","김가루","멸치","참치캔","어묵","미역","새우","오징어","고등어","메추리알","만두"] },
  { name:"소스·양념", icon:"🧂", items:["간장","고추장","된장","고춧가루","참기름","식용유","설탕","소금","식초","깨","굴소스","케첩","마요네즈","다진마늘","물엿","카레가루","새우젓"] },
];

/* 재료 표준화: 다진마늘=마늘 취급 등 매칭 보정 */
const ALIAS = { "다진마늘":"마늘", "쌀":"밥" };
const norm = (s)=> ALIAS[s] || s;

/* ============================================================
   레시피 DB (한식·아시안 20개)
   ing: [재료명, 분량텍스트, 단가(원), 필수여부]
   단가 = 이 요리에 쓰는 분량 기준 대략 비용
============================================================ */
const RECIPES = [
  { id:1, name:"김치볶음밥", emoji:"🍳", time:15, level:"쉬움", servings:1, total:2500,
    ing:[["밥","1공기",300],["김치","1컵",500],["계란","1개",400],["대파","약간",200],["식용유","1큰술",100],["참기름","약간",150],["간장","1작은술",100]],
    steps:["팬에 식용유를 두르고 송송 썬 대파를 볶아 파기름을 낸다.","김치를 잘게 썰어 넣고 2~3분 볶는다.","밥을 넣고 간장으로 간하며 고슬하게 볶는다.","참기름을 두르고 그릇에 담는다.","계란프라이를 올린다."] },
  { id:2, name:"계란말이", emoji:"🍳", time:10, level:"쉬움", servings:2, total:1400,
    ing:[["계란","3개",1200],["대파","약간",150],["당근","약간",200],["소금","약간",30],["식용유","1큰술",100]],
    steps:["계란을 풀고 잘게 썬 대파·당근, 소금을 넣어 섞는다.","약불 팬에 기름을 얇게 두른다.","계란물을 부어 가장자리가 익으면 돌돌 말아준다.","2~3번 나눠 부으며 두툼하게 만 뒤 한 김 식혀 썬다."] },
  { id:3, name:"된장찌개", emoji:"🍲", time:25, level:"보통", servings:2, total:3000,
    ing:[["된장","2큰술",400],["두부","1/2모",700],["애호박","1/4개",400],["양파","1/2개",300],["대파","약간",200],["감자","1개",400],["다진마늘","1작은술",200]],
    steps:["냄비에 물을 붓고 된장을 풀어 끓인다.","감자·양파를 넣고 끓인다.","애호박과 두부를 넣는다.","다진마늘과 대파를 넣고 한소끔 더 끓인다."] },
  { id:4, name:"김치찌개", emoji:"🍲", time:30, level:"보통", servings:2, total:4500,
    ing:[["김치","2컵",800],["돼지고기","150g",2500],["두부","1/2모",700],["대파","약간",200],["고춧가루","1큰술",200],["다진마늘","1작은술",100]],

/* ============================================================

============================================================ */
const load = (k, def)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } };
const save = (k, v)=> localStorage.setItem(k, JSON.stringify(v));

const won = (n)=> n.toLocaleString("ko-KR")+"원";
const todayStr = ()=> new Date().toISOString().slice(0,10);
const daysLeft = (dateStr)=>{
  if(!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00");
  const t = new Date(todayStr()+"T00:00:00");
  return Math.round((d - t)/86400000);
};

/* ============================================================
   목록에 없는 재료 → 레시피 자동 생성
   기본 레시피가 쓰지 않는 '새 재료'를 냉장고에 담으면,
   그 재료를 주재료로 하는 조리법(볶음·무침·된장국·전)을 만들어 준다.
============================================================ */
const RECIPE_ING_SET = new Set(RECIPES.flatMap(r=>r.ing.map(i=>norm(i[0]))));

function generateForNovel(fridge){
  const seen = new Set();
  const novel = [];
  fridge.forEach(f=>{
    const key = norm(f.name);
    if(key && !RECIPE_ING_SET.has(key) && !seen.has(key)){ seen.add(key); novel.push(f.name); }
  });
  let id = 1001;
  const out = [];
  novel.forEach(X=>{
    out.push(
      { id:id++, gen:true, name:`${X}볶음`, emoji:"🥘", time:15, level:"쉬움", servings:2, total:1650,
        ing:[[X,"적당량",1000],["다진마늘","1작은술",100],["간장","1큰술",100],["식용유","1큰술",100],["대파","약간",200],["참기름","약간",150]],
        steps:[`${X}을(를) 먹기 좋게 썬다.`,"팬에 기름을 두르고 마늘을 볶아 향을 낸다.",`${X}을(를) 넣고 센 불에 볶는다.`,"간장으로 간하고 대파·참기름을 둘러 마무리한다."] },
      { id:id++, gen:true, name:`${X}무침`, emoji:"🥗", time:10, level:"쉬움", servings:2, total:1550,
        ing:[[X,"적당량",1000],["고춧가루","1작은술",200],["간장","1작은술",100],["식초","1작은술",100],["다진마늘","1작은술",100],["참기름","약간",150],["깨","약간",100]],
        steps:[`${X}을(를) 끓는 물에 살짝 데친다.`,"찬물에 헹궈 물기를 짠다.","고춧가루·간장·식초·마늘로 무친다.","참기름과 깨를 뿌린다."] },
      { id:id++, gen:true, name:`${X}된장국`, emoji:"🍲", time:20, level:"보통", servings:2, total:2100,
        ing:[[X,"적당량",1000],["된장","1큰술",400],["두부","1/4모",400],["대파","약간",200],["다진마늘","1작은술",100]],
        steps:["냄비에 물을 붓고 된장을 푼다.",`${X}을(를) 넣고 끓인다.`,"두부를 넣는다.","마늘·대파를 넣고 한소끔 더 끓인다."] },
      { id:id++, gen:true, name:`${X}전`, emoji:"🥞", time:20, level:"쉬움", servings:2, total:2080,
        ing:[[X,"적당량",1000],["밀가루","1컵",500],["계란","1개",400],["식용유","넉넉히",150],["소금","약간",30]],
        steps:[`${X}을(를) 잘게 썬다.`,"밀가루·계란·물·소금으로 반죽한다.",`${X}을(를) 넣어 섞는다.`,"팬에 기름을 두르고 노릇하게 부친다."] }
    );
  });
  return out;
}

  const [logs, setLogs] = useState(()=>load("fr_logs", []));           // {id,recipe,date,memo,photo,cost}
  const [checked, setChecked] = useState(()=>load("fr_checked", []));  // shopping checked names
  const [settings, setSettings] = useState(()=>load("fr_settings", { dineOut:12000, urgentDays:3 }));
  const [detail, setDetail] = useState(null);    // recipe object
  const [logFor, setLogFor] = useState(null);     // recipe to log
  const [shopFor, setShopFor] = useState(null);   // recipe → 맞춤 장보기 시트
  const [toast, setToast] = useState("");

  useEffect(()=>save("fr_fridge", fridge), [fridge]);
  useEffect(()=>save("fr_favs", favs), [favs]);
  useEffect(()=>save("fr_logs", logs), [logs]);
  useEffect(()=>save("fr_checked", checked), [checked]);
  useEffect(()=>save("fr_settings", settings), [settings]);

  const showToast = (m)=>{ setToast(m); setTimeout(()=>setToast(""), 1700); };

  const haveSet = useMemo(()=> new Set(fridge.map(f=>norm(f.name))), [fridge]);

  /* 유통기한 임박 재료 (정상 보유 & urgentDays 이내) */
  const urgentNames = useMemo(()=>{
    const s = new Set();
    fridge.forEach(f=>{ const d=daysLeft(f.exp); if(d!==null && d>=0 && d<=settings.urgentDays) s.add(norm(f.name)); });
    return s;
  }, [fridge, settings.urgentDays]);

  /* 목록에 없는 재료로 자동 생성한 레시피 */
  const genRecipes = useMemo(()=> generateForNovel(fridge), [fridge]);

  /* 레시피별 매칭 계산 (기본 + 자동 생성) */
  const analyzed = useMemo(()=>{
    return [...RECIPES, ...genRecipes].map(r=>{
      const have = [], miss = [];
      r.ing.forEach(i=>{
        const key = norm(i[0]);
        if(haveSet.has(key)) have.push(i[0]); else miss.push(i[0]);
      });
      const matchRate = Math.round(have.length / r.ing.length * 100);
      const usesUrgent = r.ing.some(i=>urgentNames.has(norm(i[0])));
      const missCount = miss.length;
      const tier = missCount===0 ? "full" : (missCount<=2 ? "near" : "more");
      const perServ = Math.round(r.total / r.servings);
      return { ...r, have, miss, matchRate, usesUrgent, missCount, tier, perServ };
    });
  }, [haveSet, urgentNames, genRecipes]);

  return (
    <div className="app">
      <Header tab={tab} />
      <main>
        {tab==="fridge" && <FridgeTab fridge={fridge} setFridge={setFridge} settings={settings} showToast={showToast} />}
        {tab==="recipes" && <RecipesTab analyzed={analyzed} favs={favs} setFavs={setFavs}
                              urgentCount={urgentNames.size} setDetail={setDetail} setLogFor={setLogFor}
                              setShopFor={setShopFor}
                              fridgeEmpty={fridge.length===0} setTab={setTab} />}
        {tab==="shop" && <ShopTab analyzed={analyzed} favs={favs} checked={checked} setChecked={setChecked} />}
        {tab==="cost" && <CostTab logs={logs} settings={settings} setSettings={setSettings} />}
        {tab==="log" && <LogTab logs={logs} setLogs={setLogs} setLogFor={setLogFor} showToast={showToast} />}
      </main>

      <TabBar tab={tab} setTab={setTab}
        urgentCount={urgentNames.size}
        shopCount={shoppingCount(analyzed, favs, checked)} />

      {detail && <DetailSheet r={detail} haveSet={haveSet} urgentNames={urgentNames}
                   onClose={()=>setDetail(null)} onCook={(r)=>{ setDetail(null); setLogFor(r); }} />}
      {shopFor && <ShopSheet r={shopFor} haveSet={haveSet} checked={checked} setChecked={setChecked}
                   onClose={()=>setShopFor(null)} />}
      {logFor && <LogForm recipe={logFor} onClose={()=>setLogFor(null)}
                   onSave={(entry)=>{ setLogs([entry, ...logs]); setLogFor(null); setTab("log"); showToast("요리 기록을 저장했어요 ✨"); }} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* 장보기 대상 개수 (즐겨찾기 or 1~2개 부족 레시피의 미보유 재료, 체크 안 한 것) */
function shoppingCount(analyzed, favs, checked){
  const names = collectShopping(analyzed, favs);
  return names.filter(n=>!checked.includes(n)).length;
}
function collectShopping(analyzed, favs){
  const map = {};
  analyzed.forEach(r=>{
    const include = favs.includes(r.id) || (r.missCount>=1 && r.missCount<=2);
    if(include) r.miss.forEach(m=>{ (map[m]=map[m]||[]).push(r.name); });
  });
  return Object.keys(map).map(n=>n); // names only
}

function FridgeTab({fridge, setFridge, settings, showToast}){
  const [custom, setCustom] = useState("");
  const [editing, setEditing] = useState(null); // name

  const has = (name)=> fridge.some(f=>f.name===name);
  const toggle = (name)=>{
    if(has(name)) setFridge(fridge.filter(f=>f.name!==name));
    else setFridge([...fridge, { name, qty:"", exp:"" }]);
  };
  const addCustom = ()=>{
    const v = custom.trim();
    if(!v) return;
    if(has(v)){ showToast("이미 있는 재료예요"); setCustom(""); return; }
    setFridge([...fridge, { name:v, qty:"", exp:"" }]);
    setCustom("");
  };
  const update = (name, patch)=> setFridge(fridge.map(f=>f.name===name?{...f,...patch}:f));
  const remove = (name)=> setFridge(fridge.filter(f=>f.name!==name));

  const expClass = (exp)=>{
    const d = daysLeft(exp);
    if(d===null) return null;
    if(d<0) return ["gone","지남"];
    if(d===0) return ["urgent","오늘까지"];
    if(d<=settings.urgentDays) return ["urgent","D-"+d];
    if(d<=7) return ["soon","D-"+d];
    return ["ok","D-"+d];
  };

  return (
    <div>
      <div className="hint">탭해서 재료를 담고, 칸을 눌러 수량·유통기한을 적어 두세요. 곧 상할 재료를 레시피가 먼저 추천해 줍니다.</div>

      {CATEGORIES.map(cat=>(
        <div className="catrow" key={cat.name}>
          <div className="catname">{cat.icon} {cat.name}</div>
          <div className="chips">
            {cat.items.map(it=>(
              <button key={it} className={"chip"+(has(it)?" on":"")} onClick={()=>toggle(it)}>{it}</button>
            ))}
          </div>
        </div>
      ))}

      <div className="catrow">
        <div className="catname">✏️ 직접 입력</div>
        <div className="addrow">
          <input value={custom} placeholder="예: 모닝글로리, 공심채, 파프리카…"
            onChange={e=>setCustom(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") addCustom(); }} />
          <button onClick={addCustom}>담기</button>
        </div>
        <div className="hint" style={{marginTop:8,marginBottom:0}}>위 목록에 없는 재료(예: 모닝글로리)를 적어 담으면, 그 재료를 활용한 레시피(볶음·무침·국·전)를 자동으로 만들어 드려요 ✨</div>
      </div>

      <div className="section-title">🧺 내 냉장고 ({fridge.length})</div>
      {fridge.length===0 ? (
        <div className="empty"><div className="e-ic">🧺</div><div className="e-t">아직 비어 있어요</div>
          <div className="e-d">위에서 가진 재료를 탭해 담아 보세요</div></div>
      ) : (
        <div className="card">
          {fridge.map(f=>{
            const ec = expClass(f.exp);
            const open = editing===f.name;
            return (
              <div key={f.name}>
                <div className="ing">
                  <span className="nm">{f.name}</span>
                  <div className="meta">
                    {f.qty && <span className="qty">{f.qty}</span>}
                    {ec && <span className={"exp "+ec[0]}>{ec[1]}</span>}
                  </div>
                  <button className="editbtn" onClick={()=>setEditing(open?null:f.name)}>{open?"▲":"✎"}</button>
                  <button className="del" onClick={()=>remove(f.name)}>×</button>
                </div>
                {open && (
                  <div style={{padding:"0 12px 8px"}}>
                    <div className="editpanel">
                      <div className="field">
                        <label>보유 수량</label>
                        <input value={f.qty} placeholder="예: 2개 / 1봉지 / 200g"
                          onChange={e=>update(f.name,{qty:e.target.value})} />
                      </div>
                      <div className="field">
                        <label>유통기한</label>
                        <input type="date" value={f.exp}
                          onChange={e=>update(f.name,{exp:e.target.value})} />
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   레시피 탭
============================================================ */
function RecipesTab({analyzed, favs, setFavs, urgentCount, setDetail, setLogFor, setShopFor, fridgeEmpty, setTab}){
  const [fTime, setFTime] = useState(0);    // 0=전체, 15, 30
  const [fLevel, setFLevel] = useState("전체");
  const [fServ, setFServ] = useState(0);    // 0=전체, 1=1인분
  const [onlyFav, setOnlyFav] = useState(false);

  const toggleFav = (id)=> setFavs(favs.includes(id)?favs.filter(x=>x!==id):[...favs,id]);

  const filtered = useMemo(()=>{
    let list = analyzed.filter(r=>{
      if(fTime===15 && r.time>15) return false;
      if(fTime===30 && r.time>30) return false;
      if(fLevel!=="전체" && r.level!==fLevel) return false;
      if(fServ===1 && r.servings!==1) return false;
      if(onlyFav && !favs.includes(r.id)) return false;
      return true;
    });
    /* 정렬: 임박재료 사용 > 매칭률 높은 순 > 부족 적은 순 */
    list.sort((a,b)=>{
      if(a.usesUrgent!==b.usesUrgent) return a.usesUrgent?-1:1;
      if(b.matchRate!==a.matchRate) return b.matchRate-a.matchRate;
      return a.missCount-b.missCount;
    });
    return list;
  }, [analyzed, fTime, fLevel, fServ, onlyFav, favs]);

  const full = filtered.filter(r=>r.tier==="full");
  const near = filtered.filter(r=>r.tier==="near");
  const more = filtered.filter(r=>r.tier==="more");

  return (
    <div>
      {fridgeEmpty &&
        <div className="card" style={{padding:"13px 14px",marginBottom:14,fontSize:13,color:"var(--ink-soft)"}}>
          냉장고가 비어 있어요. <b style={{color:"var(--accent)",cursor:"pointer"}} onClick={()=>setTab("fridge")}>재료 먼저 담기 →</b>
        </div>}

      {urgentCount>0 &&
        <div className="card" style={{padding:"12px 14px",marginBottom:14,fontSize:13,background:"var(--amber-soft)",borderColor:"var(--amber)"}}>
          ⏰ 곧 상하는 재료 <b>{urgentCount}개</b>가 있어요. 이 재료를 쓰는 레시피를 위로 올렸어요.
        </div>}

      <div className="filters" style={{marginBottom:8}}>
        {[[0,"⏱ 시간 전체"],[15,"15분 이내"],[30,"30분 이내"]].map(([v,l])=>(
          <button key={v} className={"fbtn"+(fTime===v?" on":"")} onClick={()=>setFTime(v)}>{l}</button>
        ))}
      </div>
      <div className="filters" style={{marginBottom:8}}>
        {["전체","쉬움","보통","어려움"].map(l=>(
          <button key={l} className={"fbtn"+(fLevel===l?" on":"")} onClick={()=>setFLevel(l)}>{l==="전체"?"난이도 전체":l}</button>
        ))}
      </div>
      <div className="filters">
        <button className={"fbtn"+(fServ===1?" on":"")} onClick={()=>setFServ(fServ===1?0:1)}>🍽 1인분</button>
        <button className={"fbtn"+(onlyFav?" on":"")} onClick={()=>setOnlyFav(!onlyFav)}>⭐ 즐겨찾기만</button>
      </div>

      {filtered.length===0 &&
        <div className="empty"><div className="e-ic">🔍</div><div className="e-t">조건에 맞는 레시피가 없어요</div>
          <div className="e-d">필터를 조금 풀어 보세요</div></div>}

      {full.length>0 && <div className="section-title">✅ 바로 만들 수 있어요 ({full.length})</div>}
      {full.map(r=><RecipeCard key={r.id} r={r} fav={favs.includes(r.id)} toggleFav={toggleFav} setDetail={setDetail} setLogFor={setLogFor} setShopFor={setShopFor} />)}

      {near.length>0 && <div className="section-title">🛒 1~2개만 더 사면 돼요 ({near.length})</div>}
      {near.map(r=><RecipeCard key={r.id} r={r} fav={favs.includes(r.id)} toggleFav={toggleFav} setDetail={setDetail} setLogFor={setLogFor} setShopFor={setShopFor} />)}

      {more.length>0 && <div className="section-title">📋 재료를 더 채우면 ({more.length})</div>}
      {more.map(r=><RecipeCard key={r.id} r={r} fav={favs.includes(r.id)} toggleFav={toggleFav} setDetail={setDetail} setLogFor={setLogFor} setShopFor={setShopFor} />)}
    </div>
  );
}

  return (

        {r.tier==="near" && <span className="b near">{r.missCount}개 부족</span>}
        {r.tier==="more" && <span className="b cost">{r.missCount}개 부족</span>}
        {r.usesUrgent && <span className="b urgent">⏰ 임박재료 활용</span>}
        {r.gen && <span className="b" style={{background:"var(--green-soft)",color:"var(--green-ink)"}}>✨ 새 재료 레시피</span>}
        <span className="b cost">한 끼 {won(r.perServ)}</span>
      </div>

      <div className="haverow">
        {r.miss.length>0 ? (
          <><span className="lab">필요:</span>
            {r.miss.map(m=><span key={m} className="ig miss">{m}</span>)}</>
        ) : (
          <span style={{color:"var(--green-ink)",fontWeight:600,fontSize:13}}>가진 재료로 충분해요 👍</span>
        )}
      </div>

      <div className="actions">
        <button className="btn-ghost" onClick={()=>setDetail(r)}>레시피</button>
        <button className="btn-ghost" onClick={()=>setShopFor(r)}>🛒 장보기</button>
        <button className="btn-prime" onClick={()=>setLogFor(r)}>만들었어요</button>
      </div>
    </div>
  );
}

/* ============================================================
   레시피별 맞춤 장보기 시트 (부족한 재료만)
============================================================ */
function ShopSheet({r, haveSet, checked, setChecked, onClose}){
  const miss = r.ing.filter(i=>!haveSet.has(norm(i[0])));
  const cost = miss.reduce((s,i)=>s+i[2],0);
  const toggle = (n)=> setChecked(checked.includes(n)?checked.filter(x=>x!==n):[...checked,n]);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="shead">
          <div>
            <h2>🛒 {r.name}</h2>
            <div className="detail-tags">
              <span>부족한 재료 {miss.length}개</span>
              {miss.length>0 && <span>추가 비용 약 {won(cost)}</span>}
            </div>
          </div>
          <button className="closeb" onClick={onClose}>×</button>
        </div>
        <div className="sbody">
          {miss.length===0 ? (
            <div className="empty">
              <div className="e-ic">🧺</div>
              <div className="e-t">장바구니가 비어 있어요!</div>
              <div className="e-d">가진 재료로 다 만들 수 있어요 👍</div>
            </div>
          ) : (
            <>
              <div className="hint">이 요리에 필요한데 냉장고에 없는 재료예요. 장 보면서 하나씩 체크해 보세요.</div>
              <div className="card">
                {miss.map(i=>{
                  const n = i[0]; const done = checked.includes(n);
                  return (
                    <div key={n} className={"shop-item"+(done?" done":"")} onClick={()=>toggle(n)}>
                      <div className={"checkbox"+(done?" on":"")}>{done?"✓":""}</div>
                      <div className="nm">{n}</div>
                      <div className="from">{i[1]} · 약 {won(i[2])}</div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function DetailSheet({r, haveSet, urgentNames, onClose, onCook}){
  const perServ = Math.round(r.total/r.servings);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="shead">
          <div>
            <h2>{r.emoji} {r.name}</h2>
            <div className="detail-tags">
              <span>⏱ {r.time}분</span><span>📊 {r.level}</span><span>🍽 {r.servings}인분</span>
            </div>
          </div>
          <button className="closeb" onClick={onClose}>×</button>
        </div>
        <div className="sbody">
          <div className="dsec-title">예상 식비</div>
          <div className="costbox">
            <div className="lab">한 끼(1인분) 기준</div>
            <div className="big">{won(perServ)}</div>
            <div className="vs">전체 {r.servings}인분 재료비 약 {won(r.total)}</div>
          </div>

          <div className="dsec-title">재료 ({r.ing.length})</div>
          {r.ing.map((i,idx)=>{
            const have = haveSet.has(norm(i[0]));
            const urgent = urgentNames.has(norm(i[0]));
            return (
              <div key={idx} className={"ing-line"+(have?"":" miss")}>
                <span className="nm">{have?"✓ ":"○ "}{i[0]} {urgent && <span style={{color:"var(--amber-ink)",fontSize:11}}>⏰</span>} <span style={{color:"var(--muted)",fontSize:12.5,fontWeight:400}}>{i[1]}</span></span>
                <span className="price">{won(i[2])}</span>
              </div>
            );
          })}

          <div className="dsec-title">만드는 법</div>
          {r.steps.map((s,idx)=>(
            <div className="step" key={idx}><span className="n">{idx+1}</span><span>{s}</span></div>
          ))}

          <button className="savebtn" style={{marginTop:22}} onClick={()=>onCook(r)}>이 요리 만들었어요 📔</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   장보기 탭
============================================================ */
function ShopTab({analyzed, favs, checked, setChecked}){
  /* 미보유 재료 → {재료: [레시피명...]} */
  const map = useMemo(()=>{
    const m = {};
    analyzed.forEach(r=>{
      const include = favs.includes(r.id) || (r.missCount>=1 && r.missCount<=2);
      if(include) r.miss.forEach(name=>{ (m[name]=m[name]||new Set()).add(r.name); });
    });
    return m;
  }, [analyzed, favs]);

  const names = Object.keys(map).sort((a,b)=> map[b].size - map[a].size);
  const toggle = (n)=> setChecked(checked.includes(n)?checked.filter(x=>x!==n):[...checked,n]);
  const clearDone = ()=> setChecked(checked.filter(n=>!names.includes(n)));

  return (
    <div>
      <div className="hint">즐겨찾기한 레시피와 ‘1~2개만 부족’한 레시피에서 빠진 재료를 모았어요. 여러 요리에 쓰이는 재료가 위로 옵니다.</div>
      {names.length===0 ? (
        <div className="empty"><div className="e-ic">🛒</div><div className="e-t">살 게 없어요!</div>
          <div className="e-d">가진 재료로 충분하거나, 레시피를 즐겨찾기 해보세요</div></div>
      ) : (
        <>
          <div className="card" style={{marginBottom:10}}>
            {names.map(n=>{
              const done = checked.includes(n);
              const fromList = Array.from(map[n]);
              return (
                <div key={n} className={"shop-item"+(done?" done":"")} onClick={()=>toggle(n)}>
                  <div className={"checkbox"+(done?" on":"")}>{done?"✓":""}</div>
                  <div>
                    <div className="nm">{n}</div>
                  </div>
                  <div className="from">
                    {fromList.length>1 ? `${fromList.length}개 요리에` : fromList[0]}
                  </div>
                </div>
              );
            })}
          </div>
          <button className="btn-ghost" style={{width:"100%",padding:12,borderRadius:12,border:"1px solid var(--line)",fontWeight:600,color:"var(--ink-soft)",background:"var(--card)"}}
            onClick={clearDone}>담은 항목 비우기</button>
        </>
      )}
    </div>
  );
}

/* ============================================================
   식비 트래커 탭
============================================================ */
function CostTab({logs, settings, setSettings}){
  const [range, setRange] = useState("week");

  const now = new Date();
  const inRange = (dateStr)=>{
    const d = new Date(dateStr+"T00:00:00");
    if(range==="week"){
      const diff = (now - d)/86400000;
      return diff>=0 && diff<7;
    } else {
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    }
  };
  const filtered = logs.filter(l=>inRange(l.date));
  const meals = filtered.length;
  const homeCost = filtered.reduce((s,l)=>s+(l.cost||0),0);
  const dineOutCost = meals * settings.dineOut;
  const saved = dineOutCost - homeCost;
  const avg = meals? Math.round(homeCost/meals) : 0;

  return (
    <div>
      <div className="seg">
        <button className={range==="week"?"on":""} onClick={()=>setRange("week")}>이번 주</button>
        <button className={range==="month"?"on":""} onClick={()=>setRange("month")}>이번 달</button>
      </div>

      <div className="statgrid">
        <div className="card stat"><div className="v">{meals}끼</div><div className="k">집밥 횟수</div></div>
        <div className="card stat"><div className="v">{won(homeCost)}</div><div className="k">총 식비</div><div className="sub">한 끼 평균 {won(avg)}</div></div>
      </div>
      <div className="card stat" style={{marginBottom:14}}>
        <div className="v save">{won(Math.max(saved,0))}</div>
        <div className="k">외식 대비 절감액 ({range==="week"?"이번 주":"이번 달"})</div>
        <div className="sub">외식이라면 {won(dineOutCost)} 들었을 거예요</div>
      </div>

      {saved>0 &&
        <div className="card" style={{padding:"13px 15px",marginBottom:14,background:"var(--green-soft)",borderColor:"var(--green)",fontSize:13.5,color:"var(--green-ink)",lineHeight:1.6}}>
          🌱 집에서 해 먹어 <b>{won(saved)}</b>을 아꼈어요.
          {range==="week" && saved>0 && <> 이대로면 한 달에 약 <b>{won(saved*4)}</b>.</>}
        </div>}

      <div className="section-title">⚙️ 기준 설정</div>
      <div className="card">
        <div className="setting-row">
          <span>외식 한 끼 평균 비용</span>
          <input type="number" value={settings.dineOut}
            onChange={e=>setSettings({...settings, dineOut:Number(e.target.value)||0})} />
        </div>
        <div style={{height:1,background:"var(--line-soft)"}}></div>
        <div className="setting-row">
          <span>유통기한 임박 기준 (일)</span>
          <input type="number" value={settings.urgentDays}
            onChange={e=>setSettings({...settings, urgentDays:Number(e.target.value)||0})} />
        </div>
      </div>
      <div className="hint" style={{marginTop:10}}>‘만들었어요’로 기록한 요리의 1인분 단가가 자동으로 합산됩니다. 외식 단가를 바꾸면 절감액이 다시 계산돼요.</div>
    </div>
  );
}

/* ============================================================
   요리 기록 탭
============================================================ */
function LogTab({logs, setLogs, setLogFor, showToast}){
  const remove = (id)=>{ setLogs(logs.filter(l=>l.id!==id)); showToast("기록을 지웠어요"); };
  return (
    <div>
      {logs.length===0 ? (
        <div className="empty"><div className="e-ic">📔</div><div className="e-t">아직 기록이 없어요</div>
          <div className="e-d">레시피에서 ‘만들었어요’를 눌러<br/>오늘의 한 끼를 남겨 보세요</div></div>
      ) : (
        logs.map(l=>(
          <div key={l.id} className="card logcard">
            {l.photo && <img src={l.photo} alt={l.recipe} />}
            <div className="lc-body">
              <div className="lc-top"><h3>{l.recipe}</h3><span className="date">{l.date}</span></div>
              {l.memo && <div className="memo">{l.memo}</div>}
              {l.cost>0 && <div className="lc-cost">식비 {won(l.cost)}</div>}
              <div className="lc-del" onClick={()=>remove(l.id)}>삭제</div>
            </div>
          </div>
        ))
      )}
    </div>
  );
}

function LogForm({recipe, onClose, onSave}){
  const [memo, setMemo] = useState("");
  const [photo, setPhoto] = useState("");
  const [cost, setCost] = useState(Math.round(recipe.total/recipe.servings));
  const fileRef = useRef();

  const onFile = (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev=> setPhoto(ev.target.result);
    reader.readAsDataURL(f);
  };
  const submit = ()=>{
    onSave({ id:Date.now(), recipe:recipe.name, date:todayStr(), memo:memo.trim(), photo, cost:Number(cost)||0 });
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="shead">
          <h2>📔 {recipe.name} 기록</h2>
          <button className="closeb" onClick={onClose}>×</button>
        </div>
        <div className="sbody logform">
          <div className="field-col">
            <label className="fl">사진</label>
            <div className="photo-drop" onClick={()=>fileRef.current.click()}>
              {photo ? <img src={photo} alt="요리 사진" /> : "📷 사진 추가하기 (선택)"}
            </div>
            <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={onFile} />
          </div>
          <div className="field-col">
            <label className="fl">한 줄 메모</label>
            <textarea value={memo} placeholder="간 조절, 다음엔 이렇게… 자유롭게 적어요"
              onChange={e=>setMemo(e.target.value)} />
          </div>
          <div className="field-col">
            <label className="fl">이번 한 끼 식비 (원)</label>
            <input type="text" inputMode="numeric" value={cost} onChange={e=>setCost(e.target.value.replace(/[^0-9]/g,""))} />
          </div>
          <button className="savebtn" onClick={submit}>기록 저장</button>
        </div>
      </div>
    </div>
  );
}

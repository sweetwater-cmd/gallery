<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스네이크 🐍</title>
<style>
  :root {
    --bg: #14110c;
    --panel: #1e1a12;
    --grid-a: #211d15;
    --grid-b: #1b170f;
    --snake: #c9a86a;
    --snake-head: #f0d79c;
    --food: #b5533f;
    --text: #e9e0cf;
    --muted: #8a8069;
    --line: #3a3222;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Gowun Batang", "Noto Serif KR", Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--snake-head);
  }
  .stats {
    display: flex;
    gap: 28px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .stats b { color: var(--text); font-weight: 500; }
  .wrap {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  canvas { display: block; background: var(--panel); }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(20,17,12,0.82);
    backdrop-filter: blur(2px);
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
  .overlay .big { color: var(--snake-head); font-size: 1.25rem; }
  button {
    font-family: inherit;
    font-size: 1rem;
    color: var(--bg);
    background: var(--snake);
    border: none;
    border-radius: 8px;
    padding: 10px 26px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.2s ease;
  }
  button:hover { background: var(--snake-head); }
  button:active { transform: scale(0.96); }
  .hint { color: var(--muted); font-size: 0.85rem; text-align: center; line-height: 1.7; }
  kbd {
    background: var(--grid-a);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--text);
  }
</style>
</head>
<body>
  <h1>스네이크 🐍</h1>
  <div class="stats">
    <div>점수 <b id="score">0</b></div>
    <div>최고 <b id="best">0</b></div>
  </div>

  <div class="wrap">
    <canvas id="board" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ovTitle">준비되셨나요?</div>
      <p id="ovText">방향키 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 로 뱀을 움직이세요.<br>먹이를 먹으면 뱀이 길어집니다.</p>
      <button id="startBtn">시작</button>
    </div>
  </div>

  <div class="hint">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>Space</kbd> 일시정지<br>
    휴대폰은 화면을 손가락으로 밀어(스와이프) 방향을 바꿔요.
  </div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');

  const CELLS = 21;              // 격자 칸 수 (가로=세로)
  const SIZE = canvas.width;     // 픽셀
  const CELL = SIZE / CELLS;

  let snake, dir, nextDir, food, score, best, running, paused, speed, loopId;

  best = Number(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 130;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 벽 충돌
    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS) {
      return gameOver();
    }
    // 몸 충돌
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = score;
      if (score % 3 === 0 && speed > 65) speed -= 6; // 조금씩 빨라짐
      placeFood();
      restartLoop();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    // 격자
    for (let y = 0; y < CELLS; y++) {
      for (let x = 0; x < CELLS; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#211d15' : '#1b170f';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    // 먹이
    const fx = food.x * CELL, fy = food.y * CELL;
    ctx.fillStyle = '#b5533f';
    ctx.beginPath();
    ctx.arc(fx + CELL / 2, fy + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // 뱀
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#f0d79c' : '#c9a86a';
      const pad = i === 0 ? 1.5 : 2.5;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function restartLoop() {
    clearInterval(loopId);
    loopId = setInterval(() => { if (!paused) tick(); }, speed);
  }

  function start() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    draw();
    restartLoop();
  }

  function gameOver() {
    clearInterval(loopId);
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    ovTitle.textContent = '게임 끝';
    ovText.innerHTML = '점수 <b style="color:#e9e0cf">' + score + '</b> · 최고 <b style="color:#e9e0cf">' + best + '</b><br>다시 해볼까요?';
    startBtn.textContent = '다시 시작';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = '잠깐 멈춤';
      ovText.innerHTML = '<kbd>Space</kbd> 를 눌러 이어서 하세요.';
      startBtn.textContent = '이어서';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
    }
  }

  function setDir(x, y) {
    // 정반대 방향으로는 못 꺾음
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  // 키보드
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) || [' '].includes(e.key)) {
      e.preventDefault();
    }
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (e.key === ' ') {
      if (running) togglePause();
      else start();
    }
  });

  // 스와이프 (터치)
  let tsx = 0, tsy = 0;
  canvas.addEventListener('touchstart', (e) => {
    tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tsx;
    const dy = e.changedTouches[0].clientY - tsy;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  startBtn.addEventListener('click', start);

  // 첫 화면
  reset();
  draw();
})();
</script>
</body>
</html>
